  examples:
    SensorSpec.lamp.gps1m:
      summary: lamp.gps1m
      description: One GPS fix per 60 s, sent as JSON SensorEvents with the same `data` shape as `lamp.gps`.
      value:
        id: lamp.gps1m
        settings_schema:
          type: object
          description: lamp.gps1m has no settings. The interval is fixed at 60 s.
          properties: {}
          maxProperties: 0
        data_schema:
          type: object
          properties:
            latitude:
              title: Latitude
              type: number
              format: double
              minimum: -90
              maximum: 90
              description: Latitude in degrees (WGS 84).
            longitude:
              title: Longitude
              type: number
              format: double
              minimum: -180
              maximum: 180
              description: Longitude in degrees (WGS 84).
            altitude:
              title: Altitude
              type: number
              format: double
              description: Altitude in meters. Omitted when the fix has no altitude.
            accuracy:
              title: Accuracy
              type: number
              format: double
              minimum: 0
              description: Horizontal accuracy radius in meters. Omitted when the fix has no accuracy.
          required:
          - latitude
          - longitude
    SensorSpec.lamp.accelerometer10hz:
      summary: lamp.accelerometer10hz
      description: 10 Hz accelerometer, uploaded as binary frames through `SensorStream.create`.
      value:
        id: lamp.accelerometer10hz
        settings_schema:
          type: object
          description: The sampling rate is fixed by the spec name, so there are no settings.
          properties: {}
          maxProperties: 0
        data_schema:
          type: object
          description: One decoded 20-byte record. Records arrive in compressed binary frames through
            `SensorStream.create`, not as SensorEvents.
          properties:
            timestamp:
              title: Timestamp
              type: integer
              format: int64
              description: 'Sample time: Unix epoch milliseconds.'
            x:
              title: X acceleration
              type: number
              format: float
              description: Acceleration along the device x axis, in m/s² (Android axes).
            y:
              title: Y acceleration
              type: number
              format: float
              description: Acceleration along the device y axis, in m/s² (Android axes).
            z:
              title: Z acceleration
              type: number
              format: float
              description: Acceleration along the device z axis, in m/s² (Android axes). Face up at rest
                reads about +9.80665.
          required:
          - timestamp
