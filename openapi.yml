          LAMP.connect("api.lamp.digital", "email@address.com", "password")
          # function-specific sample code here
      - lang: go
        label: R Script
        source: |
          library(LAMP)
          LAMP.connect("api.lamp.digital", "email@address.com", "password")
          # function-specific sample code here
      - lang: shell
        label: cURL
        source: |
          curl "https://api.lamp.digital/participant/U1234567890/sensor-stream?sensor_spec=lamp.accelerometer50hz&from=1790000100000&to=1790000400000" \
            -H "x-api-key: $LAMP_API_KEY"
