      properties:
        id:
          type: string
          readOnly: true
          description: The self-referencing identifier to this object.
          example: U1234567890
      required:
      - id
    Activity:
      type: object
      description: An activity that may be performed by a participant in a study.
      properties:
        id:
          type: string
          readOnly: true
          description: The self-referencing identifier to this object.
          example: 2wp97csc3g57ptznhhkg
        spec:
          type: string
          description: The specification, parameters, and type of the activity.
          example: lamp.survey
        name:
          type: string
          description: The name of the activity.
          example: Mood Survey
        settings:
          type: object
          additionalProperties: true
          description: The configuration settings for the activity.
          example:
            questions:
            - text: What day is it today?
              description: Please answer based on when you received the notification
                for this survey.
              type: slider
              options:
              - Sunday
              - Monday
              - Tuesday
              - Wednesday
              - Thursday
              - Friday
              - Saturday
        schedule:
          type: array
          description: The notification schedule for the activity.
          items:
            anyOf:
            - type: object
              description: An advanced scheduling item.
              properties:
                start:
                  type: integer
                  format: int64
                  description: 'The UNIX Epoch date-time representation: number of
                    milliseconds since 1/1/1970 12:00 AM.'
                interval:
                  type: array
                  items: {}
                  description: ''
                repeat_count:
                  type: integer
                  format: int64
                  description: ''
                end:
                  type: integer
                  format: int64
                  description: 'The UNIX Epoch date-time representation: number of
                    milliseconds since 1/1/1970 12:00 AM.'
            - type: object
              description: A simplified scheduling item.
              properties:
                start_date:
                  type: string
                  format: date-time
                  description: The date after which this schedule should begin firing.
                  example: '2020-10-28T20:50:12.000Z'
                time:
                  type: string
                  format: date-time
                  description: For certain `repeat_interval` types, specify the hour
                    and minute of the day to fire.
                  example: '2020-10-28T20:50:12.000Z'
                repeat_interval:
                  type: string
                  enum:
                  - hourly
                  - every3h
                  - every6h
                  - every12h
                  - daily
                  - biweekly
                  - triweekly
                  - weekly
                  - bimonthly
                  - monthly
                  - custom
                  - none
                  description: If set to `hourly`, `every3h`, `every6h`, or `every12h`,
                    only the `time` parameter's minute field is used. If set to anything
                    other than `custom` or `none`, the `time` parameter's hour and
                    minute field are both used. The `biweekly` option refers to Tue/Thurs
                    and `triweekly` option refers to Mon/Wed/Fri. The `bimonthly`
                    option refers to twice a month. The `custom` option refers to
                    only using the `custom_times` array, and the `none` option means
                    to only trigger the schedule once.
                  example: every6h
                custom_times:
                  type: array
                  items:
                    type: string
                    format: date-time
                    description: A specific date-time to fire at.
                    example: '2020-10-28T20:50:12.000Z'
                  nullable: true
                  description: For `custom` schedules, specify a list of all specific
                    date-times to fire at.
          example:
          - start_date: '2020-10-24T14:17:00.000Z'
            time: '2020-10-23T16:17:33.291Z'
            repeat_interval: every3h
            custom_time:
            - '2020-10-23T14:18:20.973Z'
            - '2020-10-23T14:18:20.973Z'
            - '2020-10-23T14:18:20.973Z'
            - '2020-10-23T14:18:20.973Z'
      required:
      - id
      - spec
      - name
      - settings
      - schedule
    Sensor:
      type: object
      description: A sensor that may or may not be available on a physical device.
      properties:
        id:
          type: string
          readOnly: true
          description: The self-referencing identifier to this object.
          example: 2wp97csc3g57ptznhhkg
        spec:
          type: string
          description: The specification, parameters, and type of the sensor.
          example: lamp.accelerometer
        name:
          type: string
          description: The name of the sensor.
          example: Accelerometer
        settings:
          type: object
          additionalProperties: true
          description: The configuration settings for the sensor.
          example:
            frequency: 5
      required:
      - id
      - spec
      - name
      - settings
    ActivityEvent:
      type: object
      description: An event generated by the participant interacting with an `Activity`.
      properties:
        timestamp:
          type: integer
          format: int64
          description: 'The UNIX Epoch date-time representation of when this event
            was recorded: number of milliseconds since 1/1/1970 12:00 AM.'
          example: 1605022000000
        duration:
          type: integer
          format: int64
          description: The duration this event lasted before recording ended.
          example: 84123
        activity:
          type: string
          description: The activity that produced this activity event.
          example: 2wp97csc3g57ptznhhkg
        static_data:
          type: object
          description: The summary information for the activity event as determined
            by the activity that created this activity event.
          example:
            assistance_required: true
            mode: expert
        temporal_slices:
          description: The specific interaction details of the activity event.
          type: array
          items:
            type: object
            description: A specific sub-detail of a `ActivityEvent` that contains
              specific  interaction information that comprises the parent `ActivityEvent`.
            properties:
              item:
                nullable: true
                description: The item that was interacted with; for example, in a
                  Jewels game, the  corresponding alphabet, or in a survey, the question
                  index.
                example: What day is it today?
              value:
                nullable: true
                description: The value of the item that was interacted with; in most
                  games,  this field is  `null`, but in a survey, this field is the
                  question  choice index.
                example: 3
              type:
                nullable: true
                description: The type of interaction that for this detail; for example,
                  in  a Jewels game,  `none` if the tapped jewel was  incorrect, or
                  `correct` if it was correct, or in  a  survey, this field will be
                  `null`.
                example: correct
              duration:
                nullable: true
                description: The time difference from the previous detail or the  start
                  of the parent result.
                example: 84280
              level:
                nullable: true
                description: The level of activity for this detail; for example, in  games
                  with multiple  levels, this field might be `2` or  `4`, but for
                  surveys and other games this field  will be `null`.
                example: 8
      required:
      - timestamp
      - activity
      - duration
      - static_data
      - temporal_slices
    SensorEvent:
      type: object
      description: An event generated by a participant interacting with the LAMP app.
      properties:
        timestamp:
          type: integer
          format: int64
          description: 'The UNIX Epoch date-time representation of when this event
            was recorded: number of milliseconds since 1/1/1970 12:00 AM.'
        sensor:
          type: string
          description: The type of the sensor event.
          example: lamp.accelerometer
        data:
          type: object
          additionalProperties: true
          description: The item information recorded within the sensor event.
          example:
            x: 0.1234
            y: 1.2345
            z: 2.3456
      required:
      - timestamp
      - sensor
      - data
    SensorStreamUpload:
      type: object
      description: |
        The `multipart/form-data` fields of `SensorStream.create`, in the order you send them: every
        text field first, then the `frame` file part. Text fields carry integers as decimal strings.

        A schema can't express two more rules, so the server checks them: `start_timestamp <=
        end_timestamp`, and both fall in the same 5-minute window (`floor(timestamp / 300000)`).
        `codec_format_version` is `24` with `openzl` and `0` with `zstd`.
      properties:
        sensor_spec:
          type: string
          enum:
          - lamp.accelerometer10hz
          - lamp.accelerometer20hz
          - lamp.accelerometer50hz
          - lamp.accelerometer100hz
          description: The accelerometer tier that produced the frame.
          example: lamp.accelerometer50hz
        start_timestamp:
          type: integer
          format: int64
          minimum: 0
          description: 'The first record''s timestamp, inclusive: Unix epoch milliseconds.'
          example: 1790000100000
        end_timestamp:
          type: integer
          format: int64
          minimum: 0
          description: 'The last record''s timestamp, inclusive: Unix epoch milliseconds.'
          example: 1790000109980
        sample_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 66000
          description: The number of 20-byte records in the decompressed frame (at most 300 s × 200 Hz
            × 1.1).
          example: 500
        codec:
          type: string
          enum:
          - openzl
          - zstd
          description: The frame's compression codec. Use `zstd` only where OpenZL is unavailable.
          example: openzl
        codec_format_version:
          type: integer
          format: int32
          enum:
          - 0
          - 24
          description: The OpenZL format version (`24`), or `0` for `zstd`.
          example: 24
        platform:
          type: string
          enum:
          - android
          - ios
          description: The platform that recorded the frame.
          example: android
        unit:
          type: string
          enum:
          - m/s^2
          description: The unit of `x`, `y`, and `z`. Always `m/s^2`.
          example: m/s^2
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The lowercase hex SHA-256 digest of the compressed `frame` bytes.
          example: a8ee18c33e9953a183864eea00deacfc3bfa6a300470a05741f6ece8003c15b6
        frame:
          type: string
          format: binary
          description: The compressed frame, at most 4 MiB (4,194,304 bytes). Send it last, as
            `application/octet-stream`.
      required:
      - sensor_spec
      - start_timestamp
      - end_timestamp
      - sample_count
      - codec
      - codec_format_version
      - platform
      - unit
      - sha256
      - frame
      oneOf:
      - description: An OpenZL frame at format version 24.
        properties:
          codec:
            enum:
            - openzl
          codec_format_version:
            enum:
            - 24
      - description: A zstd frame.
        properties:
          codec:
            enum:
            - zstd
          codec_format_version:
            enum:
            - 0
    SensorStreamFrame:
      type: object
      description: The metadata of one stored accelerometer frame, as `SensorStream.list` returns it.
      properties:
        id:
          type: string
          description: The frame's file ID. Pass it to `SensorStream.view` to download the bytes.
          example: 6718a0c2e4b0a1b2c3d4e5f6
        sensor_spec:
          type: string
          enum:
          - lamp.accelerometer10hz
          - lamp.accelerometer20hz
          - lamp.accelerometer50hz
          - lamp.accelerometer100hz
          example: lamp.accelerometer50hz
        start_timestamp:
          type: integer
          format: int64
          minimum: 0
          description: 'The first record''s timestamp, inclusive: Unix epoch milliseconds.'
          example: 1790000100000
        end_timestamp:
          type: integer
          format: int64
          minimum: 0
          description: 'The last record''s timestamp, inclusive: Unix epoch milliseconds.'
          example: 1790000109980
        sample_count:
          type: integer
          format: int32
          minimum: 1
          maximum: 66000
          example: 500
        codec:
          type: string
          enum:
          - openzl
          - zstd
          example: openzl
        codec_format_version:
          type: integer
          format: int32
          enum:
          - 0
          - 24
          example: 24
        platform:
          type: string
          enum:
          - android
          - ios
          example: android
        unit:
          type: string
          enum:
          - m/s^2
          example: m/s^2
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The lowercase hex SHA-256 digest of the compressed bytes. The download's `ETag`
            has the same value.
          example: a8ee18c33e9953a183864eea00deacfc3bfa6a300470a05741f6ece8003c15b6
        byte_length:
          type: integer
          format: int32
          minimum: 1
          maximum: 4194304
          description: The size of the compressed frame, in bytes.
          example: 4188
        upload_date:
          type: string
          format: date-time
          description: When the server stored the frame.
          example: '2026-10-23T12:00:00.000Z'
      required:
      - id
      - sensor_spec
      - start_timestamp
      - end_timestamp
      - sample_count
      - codec
      - codec_format_version
      - platform
      - unit
      - sha256
      - byte_length
      - upload_date
      oneOf:
      - properties:
          codec:
            enum:
            - openzl
          codec_format_version:
            enum:
            - 24
      - properties:
          codec:
            enum:
            - zstd
          codec_format_version:
            enum:
            - 0
    Credential:
      type: object
      description: Every object can have one or more credential(s) associated with
        it. (i.e. `my_researcher.credentials = ['person A', 'person B', 'api A'',
        'person C', 'api B']`)
      properties:
        origin:
          type: string
          description: The root object this credential is attached to. The scope of
            this credential is limited to the object itself and any children.
          example: U1234567890
        access_key:
          type: string
          description: Username or machine-readable public key (access).
          example: my_email@address.com
        secret_key:
          type: string
          nullable: true
          writeOnly: true
          description: SALTED HASH OF Password or machine-readable private key (secret).
        description:
          type: string
          description: The user-visible description of the credential.
          example: Firstname Lastname
      required:
      - origin
      - access_key
      - secret_key
      - description
  parameters:
