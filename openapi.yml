  "/participant/{participant_id}/sensor-stream":
    post:
      operationId: SensorStream.create
      summary: Upload a compressed accelerometer frame for a Participant.
      description: |
        Upload one compressed frame of 20-byte accelerometer records for a `lamp.accelerometer*hz`
        sensor. Send every text field before the `frame` file part; the server rejects a request whose
        file part arrives first. The `frame` part is at most 4 MiB (4,194,304 bytes).

        Retrying the same frame (same Participant, `sensor_spec`, `start_timestamp`, and `sha256`) is
        safe: the server returns the stored frame's `id` with `duplicate: true`. A different `sha256`
        for the same Participant, `sensor_spec`, and `start_timestamp` returns `409`.

        The `MobileToken` scheme (`Authorization: Bearer <mobile token>`) is the primary credential.
        The legacy Basic `Authorization` header works only on servers that enable legacy mobile tokens.
        See `docs/sensor-stream.md` for the record layout, framing, and codecs.
      tags:
      - SensorStream
      parameters:
      - "$ref": "#/components/parameters/SensorStreamParticipantId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/SensorStreamUpload"
            encoding:
              frame:
                contentType: application/octet-stream
            examples:
              lamp.accelerometer10hz:
                "$ref": "#/components/examples/SensorStreamUpload.lamp.accelerometer10hz"
              lamp.accelerometer20hz:
                "$ref": "#/components/examples/SensorStreamUpload.lamp.accelerometer20hz"
              lamp.accelerometer50hz:
                "$ref": "#/components/examples/SensorStreamUpload.lamp.accelerometer50hz"
              lamp.accelerometer100hz:
                "$ref": "#/components/examples/SensorStreamUpload.lamp.accelerometer100hz"
      responses:
        '200':
          description: The frame is stored, or an identical frame was already stored (`duplicate` is `true`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The stored frame's file ID.
                        example: 6718a0c2e4b0a1b2c3d4e5f6
                      duplicate:
                        type: boolean
                        description: Present and `true` when this exact frame was already stored.
                        example: true
                    required:
                    - id
                required:
                - data
        '400':
          description: A field is missing, invalid, or sent after the `frame` part. Don't retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: Not authenticated. Retry after you refresh the session.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: Not authorized for this Participant. Retry after you refresh the session.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: A frame with this Participant, `sensor_spec`, and `start_timestamp` is already stored
            with a different `sha256`. Don't retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: The `frame` part is larger than 4 MiB. Never retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        default:
          description: Error. Retry `5xx` responses with exponential backoff.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - MobileToken: []
      - Authorization: []
      x-code-samples:
      - lang: js
        label: JavaScript
        source: |
          import LAMP from 'lamp-core'
          await LAMP.connect({ serverAddress: "api.lamp.digital", accessKey: "email@address.com", secretKey: "password" })
          // function-specific sample code here
      - lang: python
        label: Python
        source: |
          import LAMP
          LAMP.connect("api.lamp.digital", "email@address.com", "password")
          # function-specific sample code here
      - lang: go
        label: R Script
        source: |
          library(LAMP)
          LAMP.connect("api.lamp.digital", "email@address.com", "password")
          # function-specific sample code here
      - lang: shell
        label: cURL
        source: |
          curl -X POST "https://api.lamp.digital/participant/U1234567890/sensor-stream" \
            -H "Authorization: Bearer $MOBILE_TOKEN" \
            -F sensor_spec=lamp.accelerometer50hz \
            -F start_timestamp=1790000100000 \
            -F end_timestamp=1790000109980 \
            -F sample_count=500 \
            -F codec=openzl \
            -F codec_format_version=24 \
            -F platform=android \
            -F unit=m/s^2 \
            -F sha256=a8ee18c33e9953a183864eea00deacfc3bfa6a300470a05741f6ece8003c15b6 \
            -F "frame=@frame.openzl;type=application/octet-stream"
    get:
      operationId: SensorStream.list
      summary: List accelerometer frames for a Participant.
      description: |
        List the metadata of every frame that overlaps `[from, to)`: a frame matches when
        `end_timestamp >= from` and `start_timestamp < to`. Results are sorted by `start_timestamp`,
        then `id`. A 5-minute window can have more than one frame; merge every frame of a window.
        Pass `next` from the response as `cursor` to read the next page; `next` is `null` on the
        last page. Download each frame with `SensorStream.view`.
      tags:
      - SensorStream
      parameters:
      - "$ref": "#/components/parameters/SensorStreamParticipantId"
      - name: sensor_spec
        in: query
        required: true
        schema:
          type: string
          enum:
          - lamp.accelerometer10hz
          - lamp.accelerometer20hz
          - lamp.accelerometer50hz
          - lamp.accelerometer100hz
        description: The accelerometer sensor spec to list.
      - name: from
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
        description: 'The start of the range, inclusive: Unix epoch milliseconds.'
      - name: to
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
        description: 'The end of the range, exclusive: Unix epoch milliseconds. Defaults to now.'
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
        description: The maximum number of frames to return.
      - name: cursor
        in: query
        schema:
          type: string
        description: The `next` value from the previous page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/SensorStreamFrame"
                  next:
                    type: string
                    nullable: true
                    description: The cursor for the next page, or `null` on the last page.
                required:
                - data
                - next
              examples:
                frames:
                  "$ref": "#/components/examples/SensorStreamFrameList"
        '400':
          description: A query parameter is missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: The API key can't read this Participant.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        default:
          description: Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - ApiKeyAuth: []
      x-code-samples:
      - lang: js
        label: JavaScript
        source: |
          import LAMP from 'lamp-core'
          await LAMP.connect({ serverAddress: "api.lamp.digital", accessKey: "email@address.com", secretKey: "password" })
          // function-specific sample code here
      - lang: python
        label: Python
        source: |
