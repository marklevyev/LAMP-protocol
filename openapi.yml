          items:
            type: string
          uniqueItems: true
          default: []
        additionalProperties:
          "$ref": "#/components/schemas/JSONSchema"
        definitions:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/JSONSchema"
          default: {}
        properties:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/JSONSchema"
          default: {}
        patternProperties:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/JSONSchema"
          default: {}
        dependencies:
